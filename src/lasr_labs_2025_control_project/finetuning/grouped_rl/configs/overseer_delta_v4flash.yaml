# Overseer-delta run (rewrite_signal): the overseer term penalises only the suspicion a
# rewrite adds over the attack it rewrote,
#   overseer_weight * max(0, suspicion(rewrite) - suspicion(original attack)),
# with each original attack scored once at startup (original_attack_suspicion.json).
# Otherwise the slim pilot's settings, with U = DeepSeek-V4.1-Flash and
# H = Qwen3.5-397B-A17B. See docs/hipt_rl/ROADMAP.md.
#
# Offline check:  python -m lasr_labs_2025_control_project.finetuning.grouped_rl.run --config <this file>
# Train:          add --allow-paid
#
# The attack data is assumed to come from base DeepSeek-V4.1-Flash (not verified).

run_name: overseer_delta_v4flash
output_dir: experiments/open-source-model/apps/rl/overseer_delta_v4flash
backend: tinker            # hf_gpu: not implemented yet
task_mode: rewrite_signal  # honest_signal / attack_signal: not wired into the driver yet
seed: 0

models:
  sender: deepseek-ai/DeepSeek-V4.1-Flash:peft:262144           # raw Tinker id (trainable LoRA)
  receiver: tinker/deepseek-ai/DeepSeek-V4.1-Flash:peft:262144  # frozen untrusted monitor
  overseer: tinker/Qwen/Qwen3.5-4B              # frozen trusted monitor (signal detector)
  backdoor_monitor: tinker/Qwen/Qwen3.5-4B      # only used if backdoor_suspicion_weight > 0

prompts:
  sender_system: RL_REWRITE_SIGNAL_SENDER_SYSTEM_PROMPT
  sender_user: RL_REWRITE_SIGNAL_SENDER_USER_PROMPT
  receiver_system: RL_SELF_SIGNAL_RECEIVER_SYSTEM_PROMPT
  overseer_system: RL_OVERSEER_SIGNAL_SYSTEM_PROMPT
  backdoor_monitor_system: DEFAULT_HONEST_MONITOR_SYSTEM_PROMPT

data:
  # U's attacks and H's honeypots on the APPS train split (odd problem IDs), supplied
  # as pipeline generation logs; not committed.
  attacks_eval: data/hipt_rl/deepseek-v4_qwen-397b_data/train/deepseek_v4_train_data.eval
  honeypots_eval: data/hipt_rl/deepseek-v4_qwen-397b_data/train/qwen397b_train_data.eval
  require_main_task: true
  require_backdoor: true
  max_tests: 10
  validation_fraction: 0.2
  max_validation_problems: 20

channel:
  kind: none               # none | minify | paraphrase (signal jamming)
  remove_comments: true    # matches the monitor configs

reward:
  reward_fn: branch        # branch | hipt
  task_weight: 1.0
  communication_weight: 1.0
  overseer_weight: 1.0
  overseer_baseline: original_attack   # none | original_attack
  overseer_delta_space: probability    # probability | logit
  failed_backdoor_weight: 1.0   # rewrites often drop the backdoor (4/16 kept it in the smoke run)
  backdoor_suspicion_weight: 0.0
  kl_coef: 0.0                  # was 0.05; KL stayed <= 0.04 in attempt 1, and the reference pass cost ~1/3 of prefill

training:
  steps: 30                     # was 50; attempt 1's trend was visible by step 30
  problems_per_step: 16
  group_size: 4                 # was 8; 2 rewrites per bit per problem
  payload_grouping: both
  loss_fn: ppo
  ppo_passes: 1                 # was 2; halves training tokens (clipping is inactive with 1 pass)
  clip_epsilon: 0.2
  learning_rate: 1.0e-5
  lora_rank: 32
  temperature: 1.0
  max_tokens: 4096
  max_context_tokens: 32768
  train_receiver: false
  max_concurrency: 32

eval:
  every: 10
  num_samples: 1           # per bit, per held-out problem
  honeypot_eval: true

preflight:
  enabled: true
  require_overseer_gap: 0.0   # log only

logging:
  wandb_project: collusion-rl-v2
  wandb_entity: spar-untrusted-monitoring-collusion
  wandb_mode: online

checkpoints:
  save_every: 10
