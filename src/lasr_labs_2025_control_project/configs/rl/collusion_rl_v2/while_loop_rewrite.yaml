# The paper's hand-written while-loop signal as a test arm: test_rewrite.yaml with the
# centralized sender prompt (as I2) and RL_WHILE_LOOP_SENDER_INSTRUCTIONS as the strategy.
# Rewrite with --label while-loop; score with rl_test.yaml and the paper's monitor prompt
# +measurement.arms.base.collusion_prompt=CAUSAL_UNTRUSTED_MONITOR_COLLUSION_SYSTEM_PROMPT.
experiment_folder: experiments/collusion-rl-v2/test
experiment_name: collusion-rl-v2
defaults:
  rewrite:
    model: tinker/deepseek-ai/DeepSeek-V4.1-Flash:peft:262144
