# Native zero-based [start, stop) range: reuse the earlier prefix batch.
experiment_folder: experiments/open-source-model/basharena/self_rec_half
experiment_name: basharena_half_train_attacks
results_folder: results/
defaults:
  dataset_type: basharena
  data_split: train
  limit:
  - 40
  - 158
runs:
  attacks:
    eval_mode: attack
    system_prompt: BASHARENA_ATTACK_SYSTEM_PROMPT
    save_path: generator/train/attacks_extension.eval
    model: tinker/Qwen/Qwen3.6-35B-A3B
