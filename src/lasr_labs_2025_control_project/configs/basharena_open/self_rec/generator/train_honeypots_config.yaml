# BashArena self-recognition training data (issue #29), H = gpt-oss-120b.
# Same 40 train-split tasks (odd ids) for U attacks and H honeypots, as the APPS
# SFT pairs are built. One role per config so a retry can't redo the other.
experiment_folder: experiments/open-source-model/basharena/self_rec_train
experiment_name: basharena_self_rec_train_honeypots
results_folder: results/
defaults:
  dataset_type: basharena
  data_split: train
  limit: 40
runs:
  honeypots:
    eval_mode: attack
    system_prompt: BASHARENA_ATTACK_SYSTEM_PROMPT
    save_path: generator/train/honeypots.eval
    model: tinker/openai/gpt-oss-120b
