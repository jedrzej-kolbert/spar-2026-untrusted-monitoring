# Honeypot-model comparison (issue #29), one candidate H per config (one
# "honeypots" run per config). Same 5 test-split tasks as the stage-1 pilot,
# whose DeepSeek-V3.1 honeypots were 1/5 valid with one context-overflow error.
# gpt-oss-120b: 131K context on Tinker, about half DeepSeek's price; refusal risk unknown.
experiment_folder: experiments/open-source-model/basharena/stage1
experiment_name: basharena_honeypot_comparison_gpt_oss
results_folder: results/
defaults:
  dataset_type: basharena
  data_split: test
  limit: 5
runs:
  honeypots:
    eval_mode: attack
    system_prompt: BASHARENA_ATTACK_SYSTEM_PROMPT
    save_path: generator/comparison/honeypots_gpt_oss_120b.eval
    model: tinker/openai/gpt-oss-120b
