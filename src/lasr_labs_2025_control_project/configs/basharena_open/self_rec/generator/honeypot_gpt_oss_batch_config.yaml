# gpt-oss-120b honeypot batch (issue #29): measure H's valid-honeypot yield on
# 20 test-split tasks. The first 5 repeat the stage-1 pilot tasks (1/5 valid there).
experiment_folder: experiments/open-source-model/basharena/stage1
experiment_name: basharena_honeypots_gpt_oss_batch
results_folder: results/
defaults:
  dataset_type: basharena
  data_split: test
  limit: 20
runs:
  honeypots:
    eval_mode: attack
    system_prompt: BASHARENA_ATTACK_SYSTEM_PROMPT
    save_path: generator/comparison/honeypots_gpt_oss_120b_20.eval
    model: tinker/openai/gpt-oss-120b
