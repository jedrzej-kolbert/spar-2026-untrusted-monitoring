# Cross-model check (issue #29): honeypots from a model U_M never saw in training
# (DeepSeek-V3.1; H in training was gpt-oss-120b), on the same 20 test-split tasks
# as attacks_qwen36_20.eval. 32K context, so per-step output capped at 4096.
experiment_folder: experiments/open-source-model/basharena/stage1
experiment_name: basharena_honeypots_deepseek_test20
results_folder: results/
defaults:
  dataset_type: basharena
  data_split: test
  limit: 20
runs:
  honeypots:
    eval_mode: attack
    system_prompt: BASHARENA_ATTACK_SYSTEM_PROMPT
    save_path: generator/comparison/honeypots_deepseek_v31_20.eval
    model: tinker/deepseek-ai/DeepSeek-V3.1
    max_tokens: 4096
