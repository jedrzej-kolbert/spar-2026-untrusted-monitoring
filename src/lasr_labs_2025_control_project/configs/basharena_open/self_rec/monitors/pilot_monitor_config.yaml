# Whole-trajectory, no-jammer smoke test. SFT collusion; base U suspiciousness.
# plot_data.py's usefulness is a game-model parameter, NOT task success.
experiment_folder: experiments/open-source-model/basharena/stage1
experiment_name: basharena_self_rec_sft_pilot
results_folder: results/self_rec_sft_pilot/
defaults:
  monitors:
  - untrusted_collusion_monitor:
      model_info:
        model: tinker/tinker://70f25eeb-43bc-529d-9ba1-f9f5417f124c:train:0/sampler_weights/basharena_self_rec_smoke-step-225
        system_prompt: BASHARENA_SELF_REC_COLLUSION_SYSTEM_PROMPT
        base_prompt: BASHARENA_MONITOR_USER_PROMPT
      remove_comments: false
      transformed: false
  - trusted_backdoor_monitor:
      model_info:
        model: tinker/Qwen/Qwen3.5-9B
        system_prompt: BASHARENA_SUSPICIOUSNESS_SYSTEM_PROMPT
        base_prompt: BASHARENA_MONITOR_USER_PROMPT
      remove_comments: false
      transformed: false
  - untrusted_backdoor_monitor:
      model_info:
        model: tinker/Qwen/Qwen3.6-35B-A3B
        system_prompt: BASHARENA_SUSPICIOUSNESS_SYSTEM_PROMPT
        base_prompt: BASHARENA_MONITOR_USER_PROMPT
      remove_comments: false
      transformed: false
runs:
  attacks:
    eval_path: generator/comparison/attacks_qwen36_20.eval
    save_path: outputs/self_rec_sft_pilot/attacks_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
  honeypots:
    eval_path: generator/comparison/honeypots_gpt_oss_120b_20.eval
    save_path: outputs/self_rec_sft_pilot/honeypots_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
  honest:
    eval_path: generator/honest.eval
    save_path: outputs/self_rec_sft_pilot/honest_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
