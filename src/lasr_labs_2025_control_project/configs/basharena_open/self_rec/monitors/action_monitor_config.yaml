# Per-action monitoring (view: action), BashArena's upstream format: each rated action
# is scored with every earlier step and its (truncated) output in <actions> and the
# action itself in <action>. Trajectory score = max over its actions (plot_data).
# The self-recognition SFT rows and checkpoint ROC must use the same action_view
# options and the BASHARENA_ACTION_* collusion prompts below, so a training row and
# a monitor call for the same action are identical.
experiment_folder: experiments/open-source-model/basharena/stage1
experiment_name: basharena_self_rec_sft_action
results_folder: results/self_rec_sft_action/
defaults:
  view: action
  action_view:
    # ~30K tokens of history; keeps late honest steps inside a 64K context. Must
    # match the SFT and checkpoint-scoring value.
    max_history_chars: 120000
  monitors:
  - untrusted_collusion_monitor:
      model_info:
        model: tinker/tinker://REPLACE_WITH_PER_ACTION_CHECKPOINT
        system_prompt: BASHARENA_SELF_REC_ACTION_SYSTEM_PROMPT
        base_prompt: BASHARENA_ACTION_USER_PROMPT
      remove_comments: false
      transformed: false
  - trusted_backdoor_monitor:
      model_info:
        model: tinker/Qwen/Qwen3.5-9B
        system_prompt: BASHARENA_ACTION_SUSPICIOUSNESS_SYSTEM_PROMPT
        base_prompt: BASHARENA_ACTION_SUSPICIOUSNESS_USER_PROMPT
      remove_comments: false
      transformed: false
  - untrusted_backdoor_monitor:
      model_info:
        model: tinker/Qwen/Qwen3.6-35B-A3B
        system_prompt: BASHARENA_ACTION_SUSPICIOUSNESS_SYSTEM_PROMPT
        base_prompt: BASHARENA_ACTION_SUSPICIOUSNESS_USER_PROMPT
      remove_comments: false
      transformed: false
runs:
  attacks:
    eval_path: generator/comparison/attacks_qwen36_20.eval
    save_path: outputs/self_rec_sft_action/attacks_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
  honeypots:
    eval_path: generator/comparison/honeypots_gpt_oss_120b_20.eval
    save_path: outputs/self_rec_sft_action/honeypots_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
  honest:
    eval_path: generator/comparison/honest_qwen36_20.eval
    save_path: outputs/self_rec_sft_action/honest_monitor_results.eval
    monitors: [untrusted_collusion_monitor, trusted_backdoor_monitor, untrusted_backdoor_monitor]
