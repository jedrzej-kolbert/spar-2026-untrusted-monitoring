# @package _global_
# The SFT-judge baseline for collusion RL: rl_test with the two V4.1 SFT judges (no
# jamming, paraphrased) in place of the base judge, on the original 309 test attacks.
#   experiment=rl_test_sft name=rlv2_baseline_sft
# Commands: src/lasr_labs_2025_control_project/rl-steps.md, "Collusion RL v2".
name: rl_test_sft
stages: [transform, monitor, game, analysis]
models:
  U: tinker/deepseek-ai/DeepSeek-V4.1-Flash:peft:262144
  generation_max_tokens: 65536
measurement:
  collusion_strategy: self_rec
  transforms: [none, paraphrased]
  arms:
    sft: {model: "sft:self_rec"}
elicitation:
  arms:
    self_rec: {}
optimization:
  bootstrap:
    replicates: 200
    chunk_size: 100
inputs:
  generate:
    test:
      attacks: /home/jkk/spar-2026-untrusted-monitoring/.claude/worktrees/v41-pilot/experiments/apps/generate/apps-262144_ft_a1611f-test-attacks-self_rec_subtle_attack-6f5c6a86b195/attacks.eval
      honeypots: /home/jkk/spar-2026-untrusted-monitoring/experiments/exports/attack_SFT_full_test_batch64/self_rec_attack_test/generator/honeypots.eval
      honest: /home/jkk/spar-2026-untrusted-monitoring/.claude/worktrees/v41-pilot/experiments/apps/generate/apps-262144_ft_a1611f-test-honest-honest-267d38248808/honest.eval
  # The V4.1 SFT judges (finetune.self_rec.<channel>), trained 29 Oct
  finetune:
    self_rec:
      none: tinker/tinker://2fcd7478-7f4f-5b17-abf4-6afc1d3b4b02:train:0/sampler_weights/self_rec_base
      paraphrased: tinker/tinker://5d7065c1-0581-5cc2-a31b-e465de6721af:train:0/sampler_weights/self_rec_paraphrased
wandb_tags: [collusion-rl-v2, baseline-sft]
