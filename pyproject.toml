[project]
name = "lasr-labs-2025-control-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nelson Gardner-Challis", email = "41055112+NelsonG-C@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.0.0",
    # 17.1.2 is the newest release with bash_arena (BashArena 1.1) that still
    # accepts inspect-ai <0.3.250; 18.x requires >=0.3.250.
    "control-arena==17.1.2",
    # every entrypoint calls load_dotenv() to pick up API keys from .env; it was
    # only ever present transitively
    "python-dotenv>=1.0.0",
    "ipython>=9.4.0",
    "matplotlib>=3.10.5",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "wandb>=0.21.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.1",
    # >=4 cannot run the codeparrot/apps loading script; settings/setting.py
    # reads its raw JSONL via huggingface-hub instead.
    "datasets>=4.4.2",
    "huggingface-hub>=0.33",
    "python-minifier>=3.0.0",
    "xai-sdk>=1.1.0",
    "pandas>=2.3.1",
    # The version control-arena 17.1.2 locks and tests against.
    "inspect-ai==0.3.201",
    "pyyaml>=6.0.1",
    "dacite>=1.9.2",
    # Tinker open-weights backend (utils/tinker_provider.py). jinja2 is needed by
    # transformers' apply_chat_template, which the provider uses for tokenisation.
    "tinker>=0.29.0",
    # Native per-family tool-call rendering/parsing for agentic tinker/ runs
    # (BashArena); the provider's plain chat-template path is unchanged.
    "tinker-cookbook>=0.5.7",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "jupyter>=1.1.1",
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "openai>=1.104.1",
    # inspect-ai 0.3.201's google provider imports ThinkingLevel; 1.69.0 is
    # the version control-arena 17.1.2 locks.
    "google-genai>=1.69.0,<2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pandas-stubs>=2.3.2.250827",
    "blobfile>=3.3.0",
]

[tool.ruff]
line-length = 88

[tool.pyright]
reportMissingParameterType = true
reportUnknownParameterType = true
typeCheckingMode = "basic"
reportAssignmentType = "warning"
reportReturnType = "warning"

[tool.pytest.ini_options]
# Monte Carlo validation tests (tests/monte_carlo/) are deselected by
# default; run them explicitly with `pytest -m mc`.
addopts = "-m 'not mc'"
asyncio_mode = "auto"
markers = [
    "mc: marks tests that rely on Monte Carlo simulation",
    "slow: marks tests as relatively slow",
]

[tool.uv.build-backend]
module-root = "src/"


[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
