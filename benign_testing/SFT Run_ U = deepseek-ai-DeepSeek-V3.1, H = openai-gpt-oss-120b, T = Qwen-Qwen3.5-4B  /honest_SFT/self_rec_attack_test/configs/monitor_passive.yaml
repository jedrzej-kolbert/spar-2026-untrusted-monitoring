experiment_folder: experiments/self_rec_attack_500
experiment_name: "passive self-recognition \u2014 None (500-problem test)"
results_folder: results/monitor_passive/
defaults:
  monitors:
  - untrusted_collusion_monitor:
      model_info:
        model: tinker/deepseek-ai/DeepSeek-V3.1
        system_prompt: SELF_REC_UNTRUSTED_MONITOR_COLLUSION_SYSTEM_PROMPT
        base_prompt: MONITOR_USER_PROMPT
      transformed: false
      remove_comments: true
runs:
  honest:
    eval_path: monitor/shared/honest.eval
    save_path: monitor/passive/honest.eval
    monitors:
    - untrusted_collusion_monitor
  attacks:
    eval_path: monitor/shared/attacks.eval
    save_path: monitor/passive/attacks.eval
    monitors:
    - untrusted_collusion_monitor
  honeypots:
    eval_path: monitor/shared/honeypots.eval
    save_path: monitor/passive/honeypots.eval
    monitors:
    - untrusted_collusion_monitor
