experiment_folder: experiments/self_rec_attack_500
experiment_name: Self-recognition 500-problem test test
results_folder: results/generate_smoke/
defaults:
  data_split: test
  limit: 500
  max_tokens: 16384
runs:
  honest:
    eval_mode: honest
    system_prompt: honest_policy_prompt
    save_path: generator/honest.eval
    model: tinker/deepseek-ai/DeepSeek-V3.1
  attacks:
    eval_mode: attack
    system_prompt: self_rec_subtle_attack_policy_prompt
    save_path: generator/attacks.eval
    model: tinker/deepseek-ai/DeepSeek-V3.1
  honeypots:
    eval_mode: attack
    system_prompt: self_rec_subtle_attack_policy_prompt
    save_path: generator/honeypots.eval
    model: tinker/openai/gpt-oss-120b
